name: Demo image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  unit:
    name: Unit and API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: demo-unit-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:ci-test-password@localhost:5432/postgres
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24)
        with:
          node-version: '24.21.0'
          cache: npm
      - run: node scripts/time-test-phase.cjs npm-version
        timeout-minutes: 2
      - run: node scripts/time-test-phase.cjs dependencies
        timeout-minutes: 5
      - run: npm test
        timeout-minutes: 5
      - name: Summarize test performance
        if: ${{ always() && !cancelled() }}
        run: node scripts/report-test-timings.cjs
      - name: Upload unit and API timing measurements
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: unit-api-timings
          path: .test-metrics/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  browser:
    name: Browser regression tests (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # File partitions balance measured journey time with no extra runners.
        # Every configured spec/device pair runs once, each lane owns its DB.
        app: [customer-core, business-core, business-operations, platform-operations]
    concurrency:
      group: demo-browser-${{ matrix.app }}-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:ci-test-password@localhost:5432/postgres
      NODE_ENV: test
      # Must match the exact @playwright/test version in package-lock.json.
      PLAYWRIGHT_CONTAINER_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble
      PLAYWRIGHT_PROJECT_GROUP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24)
        with:
          node-version: '24.21.0'
          cache: npm
      - run: node scripts/time-test-phase.cjs npm-version
        timeout-minutes: 2
      - run: node scripts/time-test-phase.cjs dependencies
        timeout-minutes: 5
      - name: Check browser image compatibility
        run: node e2e/ci-container.cjs --check
      - name: Pull preinstalled browsers and Linux dependencies
        run: node scripts/time-test-phase.cjs browser-pull
        timeout-minutes: 5
      - name: Browser regression and end-to-end tests (${{ matrix.app }})
        run: node e2e/ci-container.cjs
        timeout-minutes: 10
      - name: Summarize test performance
        if: ${{ always() && !cancelled() }}
        run: node scripts/report-test-timings.cjs
      - name: Upload browser report and failure diagnostics
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: playwright-results-${{ matrix.app }}
          path: |
            playwright-report/
            test-results/
            .test-metrics/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build demo image once
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: demo-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 (Node 24)
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 (Node 24)
        timeout-minutes: 9
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: nitewide-demo:test
          build-args: |
            RELEASE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/nitewide-demo.tar
          cache-from: type=gha,scope=nitewide-demo-amd64
          cache-to: type=gha,scope=nitewide-demo-amd64,mode=max
      - name: Check runtime image and checksum
        working-directory: ${{ runner.temp }}
        timeout-minutes: 2
        run: |
          docker load --input nitewide-demo.tar
          test "$(docker image inspect nitewide-demo:test --format '{{.Os}}/{{.Architecture}}')" = 'linux/amd64'
          test "$(docker image inspect nitewide-demo:test --format '{{.Config.User}}')" = 'node'
          docker run --rm --entrypoint node nitewide-demo:test -e "const fs=require('node:fs'); for(const p of ['apps/api/src/server.js','apps/api/src/worker.js','apps/api/src/background/runtime.js','apps/customer/dist/index.html','apps/business/dist/index.html','apps/admin/dist/index.html','deploy/start.cjs','deploy/supervise.cjs']) fs.accessSync(p); if(fs.existsSync('.env')) throw Error('Unexpected environment file');"
          docker run --rm --entrypoint node nitewide-demo:test -e "if(require('./apps/api/release.json').revision !== process.argv[1]) throw Error('Runtime release identity differs from verified image');" "$GITHUB_SHA"
          sha256sum nitewide-demo.tar > nitewide-demo.tar.sha256
      - name: Retain the built image for publication without rebuilding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        timeout-minutes: 3
        with:
          name: demo-image
          path: |
            ${{ runner.temp }}/nitewide-demo.tar
            ${{ runner.temp }}/nitewide-demo.tar.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  verify:
    # Retain the existing required-check name while gating all parallel jobs.
    needs: [unit, browser, build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every verification job to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$BUILD_RESULT" = success
          echo 'Unit/API tests, browser tests, and image checks passed.'

  publish:
    needs: [verify, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: demo-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - name: Skip publication of a superseded commit
        id: current
        timeout-minutes: 1
        run: |
          current_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; this run will not publish or deploy.'
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        if: steps.current.outputs.current == 'true'
        timeout-minutes: 3
        with:
          name: demo-image
          path: ${{ runner.temp }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 (Node 24)
        if: steps.current.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        if: steps.current.outputs.current == 'true'
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nitewide-demo" >> "$GITHUB_OUTPUT"
      - name: Publish the exact checked image
        id: push
        if: steps.current.outputs.current == 'true'
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          sha256sum --check nitewide-demo.tar.sha256
          docker load --input nitewide-demo.tar
          docker tag nitewide-demo:test "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          digest=$(docker image inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{json .RepoDigests}}' | jq -er --arg prefix "$IMAGE@" '.[] | select(startswith($prefix)) | split("@")[1]')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker tag nitewide-demo:test "$IMAGE:demo"
          docker push "$IMAGE:demo"

  deploy:
    needs: publish
    if: needs.publish.outputs.digest != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    concurrency:
      group: demo-deploy-${{ github.ref }}
      cancel-in-progress: false
    environment: demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - name: Deploy only the current main commit
        id: current
        timeout-minutes: 1
        run: |
          current_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; skipping this deployment request.'
          fi
      - name: Deploy verified image or commit when Render hook is configured
        if: steps.current.outputs.current == 'true'
        timeout-minutes: 1
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEMO_DEPLOY_HOOK }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo 'Image published. Configure RENDER_DEMO_DEPLOY_HOOK after the first Blueprint deployment.'
            exit 0
          fi
          status=$(curl --connect-timeout 10 --max-time 30 --silent --show-error --get "$RENDER_DEPLOY_HOOK" \
            --data-urlencode "imgURL=$IMAGE@$DIGEST" --output /dev/null --write-out '%{http_code}')
          if [ "$status" = 400 ]; then
            echo 'Render rejected the image override; deploying the verified Git commit instead.'
            curl --connect-timeout 10 --max-time 30 --fail --silent --show-error --get "$RENDER_DEPLOY_HOOK" \
              --data-urlencode "ref=$GITHUB_SHA" --output /dev/null
          elif [ "$status" != 200 ] && [ "$status" != 202 ]; then
            echo "Render deploy hook failed with HTTP $status"
            exit 1
          fi
