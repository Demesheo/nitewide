name: Demo image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: demo-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:ci-test-password@localhost:5432/postgres
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24)
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm install --global npm@12.1.0
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: docker build --platform linux/amd64 -t nitewide-demo:test .

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 (Node 24)
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 (Node 24)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nitewide-demo" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 (Node 24)
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:demo
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - name: Deploy verified image or commit when Render hook is configured
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEMO_DEPLOY_HOOK }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo 'Image published. Configure RENDER_DEMO_DEPLOY_HOOK after the first Blueprint deployment.'
            exit 0
          fi
          status=$(curl --silent --show-error --get "$RENDER_DEPLOY_HOOK" \
            --data-urlencode "imgURL=$IMAGE@$DIGEST" --output /dev/null --write-out '%{http_code}')
          if [ "$status" = 400 ]; then
            echo 'Render rejected the image override; deploying the verified Git commit instead.'
            curl --fail --silent --show-error --get "$RENDER_DEPLOY_HOOK" \
              --data-urlencode "ref=$GITHUB_SHA" --output /dev/null
          elif [ "$status" != 200 ] && [ "$status" != 202 ]; then
            echo "Render deploy hook failed with HTTP $status"
            exit 1
          fi
